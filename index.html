<!DOCTYPE html>
<html>
<head>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e88e5">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	
<style>

body {
  font-family: Arial, sans-serif;
  background: #f1f1f1;
  margin: 0;
}

.header {
  background: #1e88e5;
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: center; /* center title */
  position: relative;
  color: white;
}

.header-title {
  font-size: 18px;
  font-weight: 600;
}

/* keep profile on right */
.profile-circle {
  position: absolute;
  right: 12px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: white;
  color: #1e88e5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  cursor: pointer;
}
/* CONTAINER */
.container {
  padding: 12px;
}

/* LABEL */
label {
  font-size: 14px;
  font-weight: 600;
  display: block;
  margin-top: 12px;
}

/* INPUT */
input {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border-radius: 6px;
  border: 1px solid #ccc;
  background: #fff; /* Changed to white to signify editable fields */
  font-size: 15px;
  box-sizing: border-box;
}

/* READONLY STYLE */
input[readonly] {
  background: #e0e0e0;
}

/* ROW FOR SEARCH */
.row {
  display: flex;
  gap: 6px;
}

.row input {
  flex: 1;
}

/* ICON BUTTON */
.icon-btn {
  width: 45px;
  border: none;
  border-radius: 6px;
  background: #1e88e5;
  color: white;
  font-size: 18px;
}

/* FILE BOX */
.file-box {
  background: #eee;
  border-radius: 6px;
  padding: 10px;
  margin-top: 8px;
  padding-bottom: 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.file-box input[type="text"] {
  margin-top: 8px;
}

/* BUTTON */
.submit-btn {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  background: #2e7d32;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
}

/* ERROR */
.error {
  color: red;
  text-align: center;
  display: none;
}

/* LOADING */
#loading {
  text-align: center;
  display: none;
  color: blue;
}

#successScreen {
  display: none;
  text-align: center;
  padding: 30px;
}
.new-entry-btn {
  margin-top: 20px;
  padding: 14px 20px;
  background: linear-gradient(45deg, #2196F3, #21CBF3);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: all 0.2s ease;
}

.new-entry-btn:active {
  transform: scale(0.96);
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
.file-wrapper {
  position: relative;
  padding-top: 10px;
}
.delete-btn {
  position: absolute;
  right: 10px;
  top: 5px;
  background: white;
  border-radius: 50%;
  padding: 6px;
  border: none;
  cursor: pointer;
  display: none;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.delete-btn .material-icons {
  font-size: 20px;
  color: #e53935;
}
.menu-btn {
  position: absolute;
  left: 12px;
  cursor: pointer;
}

.menu-btn .material-icons {
  font-size: 26px;
  color: white;
}

/* SIDE MENU */
.side-menu {
  position: fixed;
  top: 0;
  left: -250px;
  width: 250px;
  height: 100%;
  background: white;
  box-shadow: 2px 0 10px rgba(0,0,0,0.2);
  transition: 0.3s;
  z-index: 1000;
}

.side-menu.open {
  left: 0;
}
.menu-header {
  padding: 18px;
  font-size: 18px;
  font-weight: bold;
  background: #1e88e5;
  color: white;
  text-align: center;
}
.menu-item {
  padding: 15px;
  border-bottom: 1px solid #eee;
  font-size: 16px;
  cursor: pointer;
}

.menu-item:hover {
  background: #f5f5f5;
}

/* OVERLAY */
#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.3);
  display: none;
  z-index: 999;
}
</style>
</head>

<body>

<div class="menu-item" onclick="window.location.href='create.html'">

<div id="readerContainer" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999;">

  ✖ Close

<script src="https://unpkg.com/html5-qrcode"></script>
	
<script>
let isVerified = false;
const loading = document.getElementById("loading");
const errorMsg = document.getElementById("errorMsg");
const duplicateMsg = document.getElementById("duplicateMsg");
const submitBtn = document.getElementById("submitBtn");
const formScreen = document.getElementById("formScreen");
const successScreen = document.getElementById("successScreen");

const titleEl = document.querySelector(".header-title");
	
document.querySelector(".header-title").innerText =
"Material Delivery";
	
function readFile(input) {
  return new Promise((resolve) => {
    const file = input.files[0];
    if (!file) return resolve("");
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.readAsDataURL(file);
  });
}

async function compressImage(input) {
  return new Promise(resolve => {
    const file = input.files[0];
    if (!file) return resolve("");

    if (file.type === "application/pdf") {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
      return;
    }

    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };

    img.onload = () => {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const MAX_WIDTH = 800;
      const scale = MAX_WIDTH / img.width;
      canvas.width = MAX_WIDTH;
      canvas.height = img.height * scale;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", 0.7));
    };
    reader.readAsDataURL(file);
  });
}

function handleKey(e){
  document.getElementById("duplicateMsg").style.display = "none";
  document.getElementById("errorMsg").style.display = "none";
  loading.innerHTML = "Loading... ⏳";
  if(e.key==="Enter") fetchData();
}

async function fetchData() {
  isVerified = false;
  const serviceInput = document.getElementById("service");
  const service = serviceInput.value.trim();
  if (!service) return;

  duplicateMsg.style.display = "none";
  errorMsg.style.display = "none";
  loading.innerHTML = "Loading... ⏳";
  loading.style.display = "block";

  try {
    const res = await fetch("https://script.google.com/macros/s/AKfycbwOybv133i3cqAU743ilXV0QWRoR6JfnGw93Nc8PQVwDrNnRFN4WSNJez9xpRR_ls3O/exec?service=" + service);
    const data = await res.json();

    if (!data || data.name === "NOT FOUND") {
      loading.style.display = "none";
      errorMsg.innerText = "❌ Service Number not found";
      errorMsg.style.display = "block";
      clearFields();
      lockFields(false);
      submitBtn.disabled = true;
      return;
    }

    const checkUrl = "https://script.google.com/macros/s/AKfycbwOybv133i3cqAU743ilXV0QWRoR6JfnGw93Nc8PQVwDrNnRFN4WSNJez9xpRR_ls3O/exec?action=search&division=" + encodeURIComponent(data.division) + "&field=service" + "&value=" + encodeURIComponent(service) + "&t=" + Date.now();
    const checkRes = await fetch(checkUrl);
    const checkData = await checkRes.json();
    const exists = Array.isArray(checkData) && checkData.length > 0;

    loading.style.display = "none";
if (exists) {
  duplicateMsg.innerText = "⚠️ Material already delivered";
  duplicateMsg.style.display = "block";
  submitBtn.disabled = true;
  isVerified = false;
  return;
}

submitBtn.disabled = false;

    document.getElementById("name").value = data.name;
    document.getElementById("phone").value = data.phone;
    document.getElementById("address").value = data.address;
    document.getElementById("division").value = data.division;
    document.getElementById("subdivision").value = data.subdivision;
    document.getElementById("section").value = data.section;
    document.getElementById("distribution").value = data.distribution;
    isVerified = true;

  } catch (err) {
    loading.style.display = "none";
    errorMsg.innerText = "❌ Network error. Try again.";
    errorMsg.style.display = "block";
    submitBtn.disabled = true;
    console.log(err);
  }
}

function reloadForm() {

  formScreen.style.display = "block";
  successScreen.style.display = "none";

  [
    "service",
    "name",
    "phone",
    "address",
    "division",
    "subdivision",
    "section",
    "distribution",
    "dpanel1",
    "dpanel2",
    "dpanel3",
    "dpanel4",
    "dinverterNo",
    "materialSurveyor"
  ].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });

  [
    "panelImg1",
    "panelImg2",
    "panelImg3",
    "panelImg4",
    "dinverter",
    "panelsPhoto",
    "bosPhoto",
    "deliveryProof"
  ].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });

  errorMsg.style.display = "none";
  duplicateMsg.style.display = "none";

  isVerified = false;
  submitBtn.disabled = false;
  submitBtn.innerText = "Submit";

  const serviceInput = document.getElementById("service");
  serviceInput.readOnly = false;
  serviceInput.style.background = "#eee";
  serviceInput.focus();

  document.querySelectorAll(".delete-btn").forEach(btn => {
    btn.style.display = "none";
  });
}

function clearFields(){
  [
    "name",
    "phone",
    "address",
    "division",
    "subdivision",
    "section",
    "distribution"
  ].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.value = "";
  });
}

function resetMessages(){
  duplicateMsg.style.display = "none";
  errorMsg.style.display = "none";
  submitBtn.disabled = false;
  isVerified = false;
  lockFields(false);
}
	
function openDashboard() {
  window.location.href = "dashboard.html";
}
function showDelete(input) {
  const btn = input.parentElement.querySelector(".delete-btn");
  if (btn) {
    btn.style.display = input.files.length ? "block" : "none";
  }
  input.style.background = "#eee";
}

function removeFile(id) {
  const input = document.getElementById(id);
  input.value = "";
  input.style.background = "#eee";

  const btn = input.parentElement.querySelector(".delete-btn");
  if (btn) btn.style.display = "none";
}

function toggleMenu() {
  const menu = document.getElementById("sideMenu");
  const overlay = document.getElementById("overlay");
  menu.classList.toggle("open");
  overlay.style.display = menu.classList.contains("open") ? "block" : "none";
}
	
// REAL-TIME FORMATTING AS USER TYPES MANUALLY
["dpanel1","dpanel2","dpanel3","dpanel4","dinverterNo"].forEach(id => {
  const input = document.getElementById(id);
  if (!input) return;

  input.addEventListener("input", () => {
    let cleanValue = input.value.toUpperCase();

    if (cleanValue.startsWith("C1ICON") || cleanValue.startsWith("C1ADMSP")) {
      cleanValue = cleanValue.substring(2);
    } else if (cleanValue.startsWith("C1") && cleanValue.length > 10) {
      cleanValue = cleanValue.substring(2);
    }

    input.value = cleanValue.replace(/[^A-Z0-9]/g, "");
    input.style.border = "1px solid #ccc";
  });
});

function lockFields(lock = true) {
  const ids = ["name","phone","address","division","subdivision","section","distribution"];
  ids.forEach(id => {
    const el = document.getElementById(id);
    el.readOnly = lock;
    el.style.background = lock ? "#e0e0e0" : "#eee";
  });
}

let html5QrScanner;

// CLEAN EXTRACTION UTILITY
function cleanBarcodeText(decodedText) {
  let value = decodedText.trim().toUpperCase();

  // Strip 'C1' from your system barcodes seamlessly
  if (value.startsWith("C1ICON") || value.startsWith("C1ADMSP")) {
    value = value.substring(2); 
  } else if (value.startsWith("C1") && value.length > 10) {
    value = value.substring(2);
  }

  return value.replace(/[^A-Z0-9]/g, "");
}

async function scanCode(fieldId) {
  try {
    if (html5QrScanner) {
      try {
        await html5QrScanner.stop();
        await html5QrScanner.clear();
      } catch (e) {}
    }

    document.getElementById("readerContainer").style.display = "block";
    document.getElementById("closeScanner").style.display = "block";

    html5QrScanner = new Html5Qrcode("reader");

    // 1. Get all available cameras on the device
    const devices = await Html5Qrcode.getCameras();
    let targetCameraId = null;

    if (devices && devices.length > 0) {
      // Look for a camera explicitly labeled back, environment, or rear
      const backCamera = devices.find(device => 
        device.label.toLowerCase().includes("back") || 
        device.label.toLowerCase().includes("environment") ||
        device.label.toLowerCase().includes("rear") ||
        device.label.toLowerCase().includes("camera 0") // Common fallback layout
      );
      
      // If found, select it; otherwise default to the last camera in the array (usually the primary back lens)
      targetCameraId = backCamera ? backCamera.id : devices[devices.length - 1].id;
    }

    const scanConfig = {
      fps: 20,
      qrbox: { width: 300, height: 150 },
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    };

    const onScanSuccess = async (decodedText) => {
      let value = cleanBarcodeText(decodedText);
      if (value.length < 4) return;

      const inputField = document.getElementById(fieldId);
      inputField.value = value;
      inputField.style.border = "1px solid #ccc";

      await closeScanner();
    };

    // 2. Start the scanner using the verified Back Camera ID
    if (targetCameraId) {
      await html5QrScanner.start(targetCameraId, scanConfig, onScanSuccess, (msg) => { console.log("Searching...", msg); });
    } else {
      // Direct constraint fallback if enumeration returns empty
      await html5QrScanner.start({ facingMode: "environment" }, scanConfig, onScanSuccess, (msg) => { console.log("Searching...", msg); });
    }

  } catch (err) {
    console.error("Camera selection failed, executing broad fallback...", err);
    // Ultimate fallback to basic video track orientation
    try {
      await html5QrScanner.start(
        { facingMode: "environment" },
        { fps: 20, qrbox: { width: 300, height: 150 } },
        async (decodedText) => {
          let value = cleanBarcodeText(decodedText);
          if (value.length < 4) return;
          document.getElementById(fieldId).value = value;
          await closeScanner();
        },
        (err) => console.log(err)
      );
    } catch (fallbackErr) {
      alert("Could not lock onto the rear camera. Please ensure permissions are granted and no other app is using the camera.");
    }
  }
}

async function closeScanner() {
  try {
    if (html5QrScanner) {
      await html5QrScanner.stop();
      await html5QrScanner.clear();
    }
  } catch (e) {
    console.log(e);
  }
  document.getElementById("readerContainer").style.display = "none";
  document.getElementById("closeScanner").style.display = "none";
}

async function submitMaterialDelivery() {

if (!isVerified) {
errorMsg.innerText = "⚠️ Please verify service number first";
errorMsg.style.display = "block";
return;
}

loading.innerHTML = "Uploading... Please wait ⏳";
loading.style.display = "block";
submitBtn.disabled = true;
submitBtn.innerText = "Uploading...";

try {
const [
  panelImg1,
  panelImg2,
  panelImg3,
  panelImg4,
  inverterImg,
  panelsPhoto,
  bosPhoto,
  deliveryProof
] = await Promise.all([
  compressImage(document.getElementById("panelImg1")),
  compressImage(document.getElementById("panelImg2")),
  compressImage(document.getElementById("panelImg3")),
  compressImage(document.getElementById("panelImg4")),
  compressImage(document.getElementById("dinverter")),
  compressImage(document.getElementById("panelsPhoto")),
  compressImage(document.getElementById("bosPhoto")),
  compressImage(document.getElementById("deliveryProof"))
]);

const data = {
  mode: "material",

  serviceNumber: document.getElementById("service").value,
  name: document.getElementById("name").value,
  phone: document.getElementById("phone").value,
  address: document.getElementById("address").value,
  division: document.getElementById("division").value,
  subdivision: document.getElementById("subdivision").value,
  section: document.getElementById("section").value,
  distribution: document.getElementById("distribution").value,

  panelImg1,
  panel1: document.getElementById("dpanel1").value,

  panelImg2,
  panel2: document.getElementById("dpanel2").value,

  panelImg3,
  panel3: document.getElementById("dpanel3").value,

  panelImg4,
  panel4: document.getElementById("dpanel4").value,

  inverterImg,
  inverterNo: document.getElementById("dinverterNo").value,

  panelsPhoto,
  bosPhoto,
  deliveryProof,

  materialSurveyor:
    document.getElementById("materialSurveyor").value
};

const res = await fetch(
  "https://script.google.com/macros/s/AKfycbwOybv133i3cqAU743ilXV0QWRoR6JfnGw93Nc8PQVwDrNnRFN4WSNJez9xpRR_ls3O/exec",
  {
    method: "POST",
    body: JSON.stringify(data)
  }
);

const result = await res.json();

loading.style.display = "none";

if (result.status === "SUCCESS") {

  formScreen.style.display = "none";
  successScreen.style.display = "block";

} else {

  alert(result.status || "Submission Failed");

  submitBtn.disabled = false;
  submitBtn.innerText = "Submit";
}

} catch (err) {
	
console.log(err);

loading.style.display = "none";
submitBtn.disabled = false;
submitBtn.innerText = "Submit";

alert("Submission Failed");

}
}

</script>
