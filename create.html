<!DOCTYPE html>
<html>
<head>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e88e5">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	
<style>

body {
  font-family: Arial, sans-serif;
  background: #f1f1f1;
  margin: 0;
}

.header {
  background: #1e88e5;
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: center; /* center title */
  position: relative;
  color: white;
}

.header-title {
  font-size: 18px;
  font-weight: 600;
}

/* keep profile on right */
.profile-circle {
  position: absolute;
  right: 12px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: white;
  color: #1e88e5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  cursor: pointer;
}
/* CONTAINER */
.container {
  padding: 12px;
}

/* LABEL */
label {
  font-size: 14px;
  font-weight: 600;
  display: block;
  margin-top: 12px;
}

/* INPUT */
input {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border-radius: 6px;
  border: 1px solid #ccc;
  background: #fff; /* Changed to white to signify editable fields */
  font-size: 15px;
  box-sizing: border-box;
}

/* READONLY STYLE */
input[readonly] {
  background: #e0e0e0;
}

/* ROW FOR SEARCH */
.row {
  display: flex;
  gap: 6px;
}

.row input {
  flex: 1;
}

/* ICON BUTTON */
.icon-btn {
  width: 45px;
  border: none;
  border-radius: 6px;
  background: #1e88e5;
  color: white;
  font-size: 18px;
}

/* FILE BOX */
.file-box {
  background: #eee;
  border-radius: 6px;
  padding: 10px;
  margin-top: 8px;
  padding-bottom: 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.file-box input[type="text"] {
  margin-top: 8px;
}

/* BUTTON */
.submit-btn {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  background: #2e7d32;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
}

/* ERROR */
.error {
  color: red;
  text-align: center;
  display: none;
}

/* LOADING */
#loading {
  text-align: center;
  display: none;
  color: blue;
}

#successScreen {
  display: none;
  text-align: center;
  padding: 30px;
}
.new-entry-btn {
  margin-top: 20px;
  padding: 14px 20px;
  background: linear-gradient(45deg, #2196F3, #21CBF3);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: all 0.2s ease;
}

.new-entry-btn:active {
  transform: scale(0.96);
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
.file-wrapper {
  position: relative;
  padding-top: 10px;
}
.delete-btn {
  position: absolute;
  right: 10px;
  top: 5px;
  background: white;
  border-radius: 50%;
  padding: 6px;
  border: none;
  cursor: pointer;
  display: none;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.delete-btn .material-icons {
  font-size: 20px;
  color: #e53935;
}
.menu-btn {
  position: absolute;
  left: 12px;
  cursor: pointer;
}

.menu-btn .material-icons {
  font-size: 26px;
  color: white;
}

/* SIDE MENU */
.side-menu {
  position: fixed;
  top: 0;
  left: -250px;
  width: 250px;
  height: 100%;
  background: white;
  box-shadow: 2px 0 10px rgba(0,0,0,0.2);
  transition: 0.3s;
  z-index: 1000;
}

.side-menu.open {
  left: 0;
}
.menu-header {
  padding: 18px;
  font-size: 18px;
  font-weight: bold;
  background: #1e88e5;
  color: white;
  text-align: center;
}
.menu-item {
  padding: 15px;
  border-bottom: 1px solid #eee;
  font-size: 16px;
  cursor: pointer;
}

.menu-item:hover {
  background: #f5f5f5;
}

/* OVERLAY */
#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.3);
  display: none;
  z-index: 999;
}
</style>
</head>

<body>
<div id="sideMenu" class="side-menu">
  <div class="menu-header">Solar Installation</div>

  <div class="menu-item" onclick="window.location.href='index.html'">
    Material Delivery
  </div>

  <div class="menu-item" onclick="window.location.href='create.html'">
    Material Installation
  </div>

  <div class="menu-item" onclick="window.location.href='edit.html'">
    Edit Details
  </div>
</div>
<div id="overlay" onclick="toggleMenu()"></div>
	
<div class="header">
  <div class="menu-btn" onclick="toggleMenu()">
    <span class="material-icons">menu</span>
  </div>
  <div class="header-title">Solar Installation</div>
  <div class="profile-circle" onclick="openDashboard()">👤</div>
</div>
	
<div class="container" id="formScreen">
  <div id="loading">Loading... ⏳</div>

  <label>Service Number</label>
  <div class="row">
    <input id="service" style="background:#eee;" placeholder="Enter Service Number" oninput="resetMessages()" onkeypress="handleKey(event)">
    <button class="icon-btn" onclick="fetchData()">🔍</button>
    <button class="icon-btn" onclick="reloadForm()">⟳</button>
  </div>

  <div id="duplicateMsg" style="color:red; display:none; margin-top:5px;">
    ⚠️ This service number already submitted
  </div>
  <div id="errorMsg" class="error">Service Number not found</div>

  <label>Customer Name</label>
  <input id="name" readonly>

  <label>Phone</label>
  <input id="phone" readonly>

  <label>Address</label>
  <input id="address" readonly>

  <label>Division</label>
  <input id="division" readonly>

  <label>Sub Division</label>
  <input id="subdivision" readonly>

  <label>Section</label>
  <input id="section" readonly>

  <label>Distribution</label>
  <input id="distribution" readonly>

<label>Panel No. 1</label>
<input id="panel1" readonly>

<label>Panel No. 2</label>
<input id="panel2" readonly>

<label>Panel No. 3</label>
<input id="panel3" readonly>

<label>Panel No. 4</label>
<input id="panel4" readonly>

<label>Inverter Serial Number</label>
<input id="inverterSerial" readonly>

  <h3>Upload Images</h3>

  <div class="file-box file-wrapper">
    <label>Panels Image (Structure Image)</label>
    <input type="file" id="panels" accept="image/*,application/pdf" onchange="showDelete(this)">
<button type="button" class="delete-btn" onclick="removeFile('panels')">
      <span class="material-icons">delete</span>
    </button>
  </div>
	
  <div class="file-box file-wrapper">
    <label>Inverter Image</label>
    <input type="file" id="inverter" accept="image/*,application/pdf" onchange="showDelete(this)">
    <button type="button" class="delete-btn" onclick="removeFile('inverter')">
      <span class="material-icons">delete</span>
    </button>
  </div>

  <div class="file-box file-wrapper">
    <label>Earth Image</label>
    <input type="file" id="earth" accept="image/*,application/pdf" onchange="showDelete(this)">
    <button type="button" class="delete-btn" onclick="removeFile('earth')">
      <span class="material-icons">delete</span>
    </button>
  </div>

  <div class="file-box file-wrapper">
    <label>Current Bill</label>
    <input type="file" id="bill" accept="image/*,application/pdf" onchange="showDelete(this)">
    <button type="button" class="delete-btn" onclick="removeFile('bill')">
      <span class="material-icons">delete</span>
    </button>
  </div>

  <div class="file-box file-wrapper">
    <label>Aadhar Card</label>
    <input type="file" id="aadhar" accept="image/*,application/pdf" onchange="showDelete(this)">
    <button type="button" class="delete-btn" onclick="removeFile('aadhar')">
      <span class="material-icons">delete</span>
    </button>
  </div>
	
  <div class="file-box file-wrapper">
    <label><b>Civil Work Image</b></label>
    <input type="file" id="doc1" accept="image/*,application/pdf" onchange="showDelete(this)">
    <button type="button" class="delete-btn" onclick="removeFile('doc1')">
      <span class="material-icons">delete</span>
    </button>
  </div>
	
  <div class="file-box file-wrapper">
    <label>Lightning Arrester Rod</label>
    <input type="file" id="doc2" accept="image/*,application/pdf" onchange="showDelete(this)">
    <button type="button" class="delete-btn" onclick="removeFile('doc2')">
      <span class="material-icons">delete</span>
    </button>
  </div>
	
  <div class="form-group" id="surveyorGroup">
    <label>Surveyor Name</label>
    <input type="text" id="surveyor" placeholder="Enter Surveyor Name" required>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submitForm()">Submit</button>
</div>

<div id="successScreen">
  <h2 style="color:green;">✅ Submitted Successfully</h2>
  <p>Your data has been saved.</p>
  <button class="new-entry-btn" onclick="reloadForm()">New Entry</button>
</div>

<div id="readerContainer" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999;">
  <div id="reader" style="width:100%; max-width:500px; margin:60px auto;"></div>
</div>

<button id="closeScanner" onclick="closeScanner()" style="display:none; position:fixed; top:10px; right:10px; z-index:10000;">
  ✖ Close
</button>
	
	
<script>
let isVerified = false;
const loading = document.getElementById("loading");
const errorMsg = document.getElementById("errorMsg");
const duplicateMsg = document.getElementById("duplicateMsg");
const submitBtn = document.getElementById("submitBtn");
const formScreen = document.getElementById("formScreen");
const successScreen = document.getElementById("successScreen");

let mode = "create";
const params = new URLSearchParams(window.location.search);
const urlMode = params.get("mode");

if (urlMode === "delivery") {
  mode = "delivery";
}
else if (urlMode === "edit") {
  mode = "edit";
}
else {
  mode = "create";
}

const titleEl = document.querySelector(".header-title");
if (titleEl) {
  if (mode === "delivery") {
  titleEl.innerText = "Material Delivery";
}
else if (mode === "edit") {
  titleEl.innerText = "Edit Details";
}
else {
  titleEl.innerText = "Material Installation";
}
}
function readFile(input) {
  return new Promise((resolve) => {
    const file = input.files[0];
    if (!file) return resolve("");
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.readAsDataURL(file);
  });
}

async function compressImage(input) {
  return new Promise(resolve => {
    const file = input.files[0];
    if (!file) return resolve("");

    if (file.type === "application/pdf") {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
      return;
    }

    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };

    img.onload = () => {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const MAX_WIDTH = 800;
      const scale = MAX_WIDTH / img.width;
      canvas.width = MAX_WIDTH;
      canvas.height = img.height * scale;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", 0.7));
    };
    reader.readAsDataURL(file);
  });
}

function handleKey(e){
  document.getElementById("duplicateMsg").style.display = "none";
  document.getElementById("errorMsg").style.display = "none";
  loading.innerHTML = "Loading... ⏳";
  if(e.key==="Enter") fetchData();
}

async function fetchData() {
  isVerified = false;
  const serviceInput = document.getElementById("service");
  const service = serviceInput.value.trim();
  if (!service) return;

  duplicateMsg.style.display = "none";
  errorMsg.style.display = "none";
  loading.innerHTML = "Loading... ⏳";
  loading.style.display = "block";

  try {
    const res = await fetch("https://script.google.com/macros/s/AKfycbwOybv133i3cqAU743ilXV0QWRoR6JfnGw93Nc8PQVwDrNnRFN4WSNJez9xpRR_ls3O/exec?service=" + service);
    const data = await res.json();

    if (!data || data.name === "NOT FOUND") {
      loading.style.display = "none";
      errorMsg.innerText = "❌ Service Number not found";
      errorMsg.style.display = "block";
      clearFields();
      lockFields(false);
      submitBtn.disabled = true;
      return;
    }

    const checkUrl =
"https://script.google.com/macros/s/AKfycbwOybv133i3cqAU743ilXV0QWRoR6JfnGw93Nc8PQVwDrNnRFN4WSNJez9xpRR_ls3O/exec?action=checkMaterial&service="
+ encodeURIComponent(service)
+ "&t=" + Date.now();
	  const checkRes = await fetch(checkUrl);
    const checkData = await checkRes.json();
	  if (!checkData.exists) {
  loading.style.display = "none";

  duplicateMsg.innerText =
  "⚠️ Material Delivery does not exist";

  duplicateMsg.style.display = "block";
  submitBtn.disabled = true;
  return;
}

    loading.style.display = "none";

if (mode === "create") {
  lockFields(true);
  submitBtn.disabled = false;
}

    document.getElementById("name").value = data.name;
    document.getElementById("phone").value = data.phone;
    document.getElementById("address").value = data.address;
    document.getElementById("division").value = data.division;
    document.getElementById("subdivision").value = data.subdivision;
    document.getElementById("section").value = data.section;
    document.getElementById("distribution").value = data.distribution;
	  try {

  const materialRes = await fetch(
    "https://script.google.com/macros/s/AKfycbwOybv133i3cqAU743ilXV0QWRoR6JfnGw93Nc8PQVwDrNnRFN4WSNJez9xpRR_ls3O/exec?action=getMaterialDetails&service=" +
    encodeURIComponent(service) +
    "&t=" + Date.now()
  );

  const material = await materialRes.json();
		  console.log(material);

  document.getElementById("panel1").value = material.panel1 || "";
  document.getElementById("panel2").value = material.panel2 || "";
  document.getElementById("panel3").value = material.panel3 || "";
  document.getElementById("panel4").value = material.panel4 || "";
  document.getElementById("inverterSerial").value = material.inverterSerial || "";
		  console.log(document.getElementById("panel1").value);
console.log(document.getElementById("inverterSerial").value);

} catch (err) {
  console.log("Material details not found", err);
}
    isVerified = true;

  } catch (err) {
    loading.style.display = "none";
    errorMsg.innerText = "❌ Network error. Try again.";
    errorMsg.style.display = "block";
    submitBtn.disabled = true;
    console.log(err);
  }
}
	
function isValidID(value) {
  return /^[A-Z0-9]+$/.test(value);
}			

async function submitForm() {
  if (!isVerified) {
    errorMsg.innerText = "⚠️ Please verify service number first";
    errorMsg.style.display = "block";
    return;
  }
  let surveyor = null;

  if (mode === "create") {
    surveyor = document.getElementById("surveyor").value.trim();
    if (!surveyor) {
      alert("Please enter Surveyor Name");
      return;
    }
  }
  errorMsg.style.display = "none";
  duplicateMsg.style.display = "none";
	
  if (!document.getElementById("service").value.trim()) {
    document.getElementById("errorMsg").innerText = "Service Number is required";
    document.getElementById("errorMsg").style.display = "block";
    return;
  }

  loading.innerHTML = "Uploading... Please wait ⏳";
  loading.style.display = "block";
  submitBtn.innerText = "Uploading...";
  submitBtn.disabled = true;

  const [panelsData, inverterData, earthData, billData, aadharData, doc1Data, doc2Data] = await Promise.all([
    compressImage(document.getElementById("panels")),
    compressImage(document.getElementById("inverter")),
    compressImage(document.getElementById("earth")),
    compressImage(document.getElementById("bill")),
    compressImage(document.getElementById("aadhar")),
    compressImage(document.getElementById("doc1")),
    compressImage(document.getElementById("doc2"))
  ]);

  const data = {
    mode: mode,
    serviceNumber: document.getElementById("service").value,
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    address: document.getElementById("address").value,
    division: document.getElementById("division").value,
    subdivision: document.getElementById("subdivision").value,
    section: document.getElementById("section").value,
    distribution: document.getElementById("distribution").value,
    panels: panelsData,
	  panel1: document.getElementById("panel1").value,
	  panel2: document.getElementById("panel2").value,
	  panel3: document.getElementById("panel3").value,
	  panel4: document.getElementById("panel4").value,
	  inverter: inverterData,
	  inverterSerial: document.getElementById("inverterSerial").value,
    earth: earthData,
    bill: billData,
    aadhar: aadharData,
    doc1: doc1Data,
    doc2: doc2Data,
    surveyor: surveyor,
  };

  try {
    const res = await fetch("https://script.google.com/macros/s/AKfycbwOybv133i3cqAU743ilXV0QWRoR6JfnGw93Nc8PQVwDrNnRFN4WSNJez9xpRR_ls3O/exec", {
      method: "POST",
      body: JSON.stringify(data)
    });
    const result = await res.json();
    loading.style.display = "none";

    if (result.status === "NOT_FOUND") {
      errorMsg.innerText = "❌ Service number not found for editing";
      errorMsg.style.display = "block";
      submitBtn.innerText = "Submit";
      submitBtn.disabled = false;
      return;
    }

    if (result.status === "ALREADY_SUBMITTED") {
      if (mode === "create") {
        duplicateMsg.innerText = "This service number already exists";
        duplicateMsg.style.display = "block";
        submitBtn.innerText = "Submit";
        submitBtn.disabled = false;
        return;
      }
      formScreen.style.display = "none";
      successScreen.style.display = "block";
      submitBtn.innerText = "Submit";
      submitBtn.disabled = false;
      return;
    }

    submitBtn.innerText = "Submit";
    formScreen.style.display = "none";
    loading.innerHTML = "Loading... ⏳";
    successScreen.style.display = "block";
  } catch (err) {
    loading.innerHTML = "Loading... ⏳";
    loading.style.display = "none";
    submitBtn.innerText = "Submit";
    alert("Submission failed");
    console.log(err);
  }
  submitBtn.disabled = false;
}

function reloadForm(){
  formScreen.style.display = "block";
  successScreen.style.display = "none";

  ["service","name","phone","address","division","subdivision","section","distribution","surveyor"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });

  ["panels","inverter","earth","bill","aadhar","doc1","doc2"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });

  errorMsg.style.display = "none";
  duplicateMsg.style.display = "none";
  isVerified = false;
  submitBtn.disabled = false;
  lockFields(false);

  const serviceInput = document.getElementById("service");
  serviceInput.readOnly = false;
  serviceInput.style.background = "#eee";

  document.querySelectorAll(".delete-btn").forEach(btn => { btn.style.display = "none"; });
  serviceInput.focus();
}

function clearFields(){
  ["name","phone","address","division","subdivision","section","distribution","surveyor"]
.forEach(id => {
  const el = document.getElementById(id);
  if (el) el.value = "";
});
}

function resetMessages(){
  duplicateMsg.style.display = "none";
  errorMsg.style.display = "none";
  submitBtn.disabled = false;
  isVerified = false;
  lockFields(false);
}
	
function openDashboard() {
  window.location.href = "dashboard.html";
}
function showDelete(input) {
  const btn = input.parentElement.querySelector(".delete-btn");
  btn.style.display = input.files.length ? "block" : "none";
  input.style.background = "#eee";
}

function removeFile(id) {
  const input = document.getElementById(id);
  input.value = "";
  input.style.background = "#eee";
  input.parentElement.querySelector(".delete-btn").style.display = "none";
}

function toggleMenu() {
  const menu = document.getElementById("sideMenu");
  const overlay = document.getElementById("overlay");
  menu.classList.toggle("open");
  overlay.style.display = menu.classList.contains("open") ? "block" : "none";
}

function lockFields(lock = true) {

  const ids = [
    "name",
    "phone",
    "address",
    "division",
    "subdivision",
    "section",
    "distribution",
    "panel1",
    "panel2",
    "panel3",
    "panel4",
    "inverterSerial"
  ];

  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;

    el.readOnly = true;   // Always readonly
    el.style.background = "#e0e0e0";
  });

}
</script>
</body>
</html>
