<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#1565C0;
    --primary-dark:#0D47A1;
    --secondary:#43A047;
    --bg:#f4f6f8;
    --white:#ffffff;
    --text:#333;
    --text-light:#666;
    --shadow:0 8px 20px rgba(0,0,0,.10);
    --shadow-hover:0 16px 35px rgba(0,0,0,.18);
    --radius:18px;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* ================= HEADER ================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:60px;
    background:var(--primary);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    font-weight:600;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

/* ================= PAGES ================= */

.page{
    padding:30px 20px;
}

.hidden{
    display:none;
}

/* ================= BUTTONS ================= */

.back-btn,
.dashboard-back-btn{

    padding:11px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    transition:.3s;
    margin-bottom:20px;

}

.back-btn{
    background:var(--primary);
    color:#fff;
}

.back-btn:hover{
    background:var(--primary-dark);
}

.dashboard-back-btn{
    background:#424242;
    color:white;
}

.dashboard-back-btn:hover{
    background:#212121;
}

/* ================= DASHBOARD ================= */

.dashboard-grid{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    max-width:900px;
    margin:auto;

}

.dashboard-card{

    background:var(--white);
    border-radius:var(--radius);
    padding:35px;
    text-align:center;
    cursor:pointer;
    transition:.35s;
    box-shadow:var(--shadow);

}

.dashboard-card:hover{

    transform:translateY(-8px);
    box-shadow:var(--shadow-hover);

}

.delivery{

    border-top:6px solid #2196F3;

}

.installation{

    border-top:6px solid var(--secondary);

}

.card-icon{

    font-size:60px;
    margin-bottom:18px;

}

.card-title{

    font-size:24px;
    font-weight:bold;

}

.card-subtitle{

    margin-top:15px;
    color:var(--text-light);

}

/* ================= COUNT BOX ================= */

.count-box{

    margin:20px 0;
    padding:16px;
    border-radius:14px;
    background:linear-gradient(135deg,#f8fbff,#eef5ff);
    border:1px solid #d9e7ff;

}

.count-box div{

    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 0;
    font-weight:600;
    color:#444;

}

.count-box span{

    color:var(--primary);
    font-size:22px;
    font-weight:700;

}

/* ================= DIVISION ================= */

.page-title{

    text-align:center;
    color:var(--primary);
    margin-bottom:25px;

}

.division-grid{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;

}

.division-card{

    background:white;
    border-radius:16px;
    padding:28px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    box-shadow:var(--shadow);

}

.division-card:hover{

    background:var(--primary);
    color:white;
    transform:translateY(-5px);

}
    /* ================= SEARCH BOX ================= */

.search-box{
    width:100%;
    padding:15px 18px;
    margin-bottom:25px;
    border:none;
    border-radius:14px;
    background:#fff;
    font-size:16px;
    outline:none;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    transition:.3s;
}

.search-box:focus{
    box-shadow:0 0 0 3px rgba(21,101,192,.18);
}

/* ================= SUMMARY ================= */

.summary{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.summary-card{
    background:#fff;
    border-radius:18px;
    padding:22px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.summary-card:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 30px rgba(0,0,0,.12);
}

.summary-number{
    font-size:34px;
    font-weight:700;
    color:#1565C0;
    margin-bottom:10px;
}

/* ================= RECORD CARD ================= */

.record-card{
    background:#fff;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
    border-left:6px solid #1565C0;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.record-card:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 30px rgba(0,0,0,.14);
}

.record-card h3{
    color:#1565C0;
    font-size:20px;
    margin-bottom:15px;
}

.record-card p{
    margin:8px 0;
    color:#555;
    font-size:15px;
    line-height:1.5;
}

.record-card b{
    color:#222;
}

/* ================= VIEW BUTTON ================= */

.view-btn{
    width:100%;
    margin-top:18px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1565C0;
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.view-btn:hover{
    background:#0D47A1;
    transform:translateY(-2px);
}

/* ================= SCROLLBAR ================= */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:#eceff1;
}

::-webkit-scrollbar-thumb{
    background:#1565C0;
    border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
    background:#0D47A1;
}

/* ================= RESPONSIVE ================= */

@media (max-width:768px){

    .page{
        padding:20px 15px;
    }

    .dashboard-grid,
    .division-grid,
    .summary{
        grid-template-columns:1fr;
    }

    .dashboard-card{
        padding:28px 20px;
    }

    .division-card{
        padding:22px;
    }

    .card-title{
        font-size:22px;
    }

    .card-icon{
        font-size:52px;
    }

    .summary-number{
        font-size:28px;
    }

    .record-card{
        padding:18px;
    }

    .record-card h3{
        font-size:18px;
    }

}

@media (max-width:480px){

    .header{
        font-size:18px;
        height:56px;
    }

    .page-title{
        font-size:22px;
    }

    .back-btn,
    .dashboard-back-btn{
        width:100%;
    }

    .count-box div{
        font-size:14px;
    }

    .count-box span{
        font-size:18px;
    }

    .search-box{
        font-size:15px;
    }

}
</style>

</head>

<body>

<div class="header" id="headerTitle">
    Dashboard
</div>

<!-- Dashboard -->

<div id="dashboardPage" class="page">
    <button class="dashboard-back-btn" onclick="goToHome()">
    Back
</button>

<div class="dashboard-grid">

<div class="dashboard-card delivery" onclick="openSection('Material Delivery')">

    <div class="card-icon">📦</div>

    <div class="card-title">Material Delivery</div>

    <div class="count-box">
        <div>Today's Count : <span id="deliveryToday">0</span></div>
        <div>Total Count : <span id="deliveryTotal">0</span></div>
    </div>

    <div class="card-subtitle">
        View delivery records
    </div>

</div>

<div class="dashboard-card installation" onclick="openSection('Material Installation')">

    <div class="card-icon">🔧</div>

    <div class="card-title">Material Installation</div>

    <div class="count-box">
        <div>Today's Count : <span id="installationToday">0</span></div>
        <div>Total Count : <span id="installationTotal">0</span></div>
    </div>

    <div class="card-subtitle">
        View installation records
    </div>

</div>

</div>

</div>

<!-- Division Page -->

<div id="divisionPage" class="page hidden">

<button class="back-btn" onclick="goBack()">
← Back
</button>

<h2 class="page-title" id="sectionTitle"></h2>

<div class="division-grid">

<div class="division-card" onclick="openDivision('TADEPALLIGUDEM')">
TADEPALLIGUDEM
</div>

<div class="division-card" onclick="openDivision('NARSIPATNAM')">
NARSIPATNAM
</div>

<div class="division-card" onclick="openDivision('CHIRALA')">
CHIRALA
</div>

<div class="division-card" onclick="openDivision('BAPATLA')">
BAPATLA
</div>

</div>

</div>

    <!-- Records Page -->

<div id="recordsPage" class="page hidden">

    <button class="back-btn" onclick="backToDivision()">
        ← Back
    </button>

    <h2 class="page-title" id="recordsTitle"></h2>

    <input
        type="text"
        id="searchBox"
        class="search-box"
        placeholder="🔍 Search Service Number, Customer..."
    >

    <div class="summary">

        <div class="summary-card">
            <div class="summary-number" id="todayCount">0</div>
            <div>Today's Count</div>
        </div>

        <div class="summary-card">
            <div class="summary-number" id="totalCount">0</div>
            <div>Total Count</div>
        </div>

    </div>

    <div id="recordsContainer">

    </div>

</div>
<script>

 const API =
"https://script.google.com/macros/s/AKfycbwOybv133i3cqAU743ilXV0QWRoR6JfnGw93Nc8PQVwDrNnRFN4WSNJez9xpRR_ls3O/exec";
    
let currentSection="";
    let selectedDivision = "";

function openSection(section){

currentSection=section;

document.getElementById("dashboardPage").classList.add("hidden");
document.getElementById("divisionPage").classList.remove("hidden");

document.getElementById("sectionTitle").innerText=section;

document.getElementById("headerTitle").innerText=section;

}

function goBack(){

document.getElementById("divisionPage").classList.add("hidden");
document.getElementById("dashboardPage").classList.remove("hidden");

document.getElementById("headerTitle").innerText="Dashboard";

}

function openDivision(name){

    selectedDivision = name;

    document.getElementById("divisionPage").classList.add("hidden");

    document.getElementById("recordsPage").classList.remove("hidden");

    document.getElementById("recordsTitle").innerHTML =
        currentSection + "<br>" + name;

    document.getElementById("headerTitle").innerText = name;

    loadDivisionRecords();

}
    function backToDivision(){

document.getElementById("recordsPage").classList.add("hidden");

document.getElementById("divisionPage").classList.remove("hidden");

document.getElementById("headerTitle").innerText=currentSection;

}async function loadDivisionRecords(){

    try{

        const type =
currentSection === "Material Delivery"
? "delivery"
: "all";

const res = await fetch(API + "?type=" + type);

        const data = await res.json();

        const records = data.filter(r =>
            r.division.toLowerCase() === selectedDivision.toLowerCase()
        );

const today = new Date().toLocaleDateString("en-GB");

document.getElementById("todayCount").innerText =
records.filter(r => r.timestamp.includes(today)).length;

        document.getElementById("totalCount").innerText = records.length;

        let html = "";

        records.forEach(r=>{

            html += `
            <div class="record-card">

                <h3>${r.service}</h3>

                <p><b>Customer :</b> ${r.name}</p>

                <p><b>Phone :</b> ${r.phone}</p>

                <p><b>Date :</b> ${r.timestamp}</p>

                <button class="view-btn"
                    onclick="viewRecord('${r.service}')">

                    View

                </button>

            </div>
            `;

        });

        document.getElementById("recordsContainer").innerHTML = html;

    }catch(err){

        console.error(err);

    }

}
    async function loadDashboardCounts(){

try{

const res = await fetch(API + "?action=dashboardCounts");

const data = await res.json();

document.getElementById("deliveryToday").textContent =
data.delivery.today;

document.getElementById("deliveryTotal").textContent =
data.delivery.total;

document.getElementById("installationToday").textContent =
data.installation.today;

document.getElementById("installationTotal").textContent =
data.installation.total;

}catch(err){

console.error(err);

}

}
    window.onload = function(){

loadDashboardCounts();

}
    
    function goToHome(){
    window.location.href = "index.html";
}
    function viewRecord(service){

    alert(service);

}

</script>

</body>
</html>
