<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f6f8;
}

/* Header */
.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:60px;
    background:#1565C0;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:600;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

/* Pages */

.page{
    padding:30px 20px;
}

.hidden{
    display:none;
}

/* Dashboard */

.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    max-width:900px;
    margin:auto;
}

.dashboard-card{
    background:#fff;
    border-radius:18px;
    padding:35px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.dashboard-card:hover{
    transform:translateY(-8px) scale(1.02);
    box-shadow:0 18px 35px rgba(0,0,0,.18);
}
.delivery{
    border-top:6px solid #2196F3;
}

.installation{
    border-top:6px solid #43A047;
}

.card-icon{
    font-size:60px;
    margin-bottom:15px;
}

.card-title{
    font-size:24px;
    font-weight:bold;
}

.card-subtitle{
    color:#666;
    margin-top:10px;
}

/* Division */

.back-btn{
    background:#1565C0;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:20px;
}

.page-title{
    text-align:center;
    color:#1565C0;
    margin-bottom:25px;
}

.division-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.division-card{
    background:white;
    padding:25px;
    text-align:center;
    border-radius:15px;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    transition:.3s;
}

.division-card:hover{
    background:#1565C0;
    color:white;
    transform:translateY(-5px) scale(1.02);
    box-shadow:0 12px 25px rgba(21,101,192,.35);
}
@media(max-width:600px){

.dashboard-grid,
.division-grid{
    grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="header" id="headerTitle">
    Dashboard
</div>

<!-- Dashboard -->

<div id="dashboardPage" class="page">

<div class="dashboard-grid">

<div class="dashboard-card delivery" onclick="openSection('Material Delivery')">
<div class="card-icon">📦</div>
<div class="card-title">Material Delivery</div>
<div class="card-subtitle">View delivery records</div>
</div>

<div class="dashboard-card installation" onclick="openSection('Material Installation')">
<div class="card-icon">🔧</div>
<div class="card-title">Material Installation</div>
<div class="card-subtitle">View installation records</div>
</div>

</div>

</div>

<!-- Division Page -->

<div id="divisionPage" class="page hidden">

<button class="back-btn" onclick="goBack()">
← Back
</button>

<h2 class="page-title" id="sectionTitle"></h2>

<div class="division-grid">

<div class="division-card" onclick="openDivision('TADEPALLIGUDEM')">
TADEPALLIGUDEM
</div>

<div class="division-card" onclick="openDivision('NARSIPATNAM')">
NARSIPATNAM
</div>

<div class="division-card" onclick="openDivision('CHIRALA')">
CHIRALA
</div>

<div class="division-card" onclick="openDivision('BAPATLA')">
BAPATLA
</div>

</div>

</div>

<script>

let currentSection="";

function openSection(section){

currentSection=section;

document.getElementById("dashboardPage").classList.add("hidden");
document.getElementById("divisionPage").classList.remove("hidden");

document.getElementById("sectionTitle").innerText=section;

document.getElementById("headerTitle").innerText=section;

}

function goBack(){

document.getElementById("divisionPage").classList.add("hidden");
document.getElementById("dashboardPage").classList.remove("hidden");

document.getElementById("headerTitle").innerText="Dashboard";

}

function openDivision(name){

alert(currentSection+"\n\n"+name);

// Next step:
// Load records of this division.

}

</script>

</body>
</html>
