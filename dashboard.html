<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
}

.header {
  height: 60px;
  display: flex;
  align-items: center;
  background: #1565C0;
  color: white;
  box-shadow: 0 3px 10px rgba(0,0,0,.15);
  position: relative;
}

.back-btn {
  font-size: 24px;
  cursor: pointer;
  padding: 0 20px;
}

.header-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: .5px;
  white-space: nowrap;
}

.search-card {
  margin: 15px;
  background: white;
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.search-title {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 15px;
  color: #1565C0;
}

.search-row {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.search-row select,
.search-row input {
  height: 45px;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 0 12px;
  font-size: 15px;
}

.search-row button {
  height: 45px;
  background: #1565C0;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
}

.summary-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 15px;
  margin: 15px;
}

.summary-card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,.08);
  cursor: pointer;
  transition: .25s;
}

.summary-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,0,0,.12);
}

.summary-icon {
  font-size: 30px;
  margin-bottom: 10px;
}

.summary-title {
  font-size: 17px;
  font-weight: bold;
  color: #444;
}

.summary-count {
  font-size: 34px;
  font-weight: bold;
  margin-top: 12px;
  color: #1565C0;
}

.summary-sub {
  margin-top: 10px;
  color: #666;
  font-size: 14px;
}

.section-title {
  margin: 18px 18px 8px;
  font-size: 18px;
  font-weight: bold;
  color: #1565C0;
}

.division-grid {
  padding: 0 15px 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.division-card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(0,0,0,.08);
  transition: .25s;
  border-left: 6px solid #1565C0;
}

.division-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,0,0,.15);
}

.division-left {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.division-name {
  font-size: 17px;
  font-weight: bold;
  color: #333;
}

.division-stats {
  display: flex;
  gap: 20px;
  font-size: 14px;
  color: #666;
}

.division-arrow {
  font-size: 24px;
  color: #1565C0;
}

.card {
  background: #fff;
  padding: 16px;
  margin: 12px 15px;
  border-radius: 14px;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
  cursor: pointer;
  transition: .25s;
}

.card:hover {
  transform: translateY(-2px);
}

.time {
  margin-top: 8px;
  font-size: 12px;
  color: #666;
}

.date-header {
  margin: 18px 15px 8px;
  font-weight: bold;
  color: #1565C0;
  font-size: 16px;
}

#totalCount {
  margin: 15px;
  background: #E3F2FD;
  padding: 15px;
  border-radius: 12px;
  border-left: 5px solid #1565C0;
  font-size: 15px;
  line-height: 1.5;
}

#detailView {
  background: white;
  margin: 15px;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

#detailView h2 {
  color: #1565C0;
  margin-top: 0;
}

.loading {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: .5; }
  100% { opacity: 1; }
}
</style>
</head>

<body>

<div class="header">
    <div class="back-btn" onclick="goBack()">←</div>
    <div class="header-title" id="mainHeader">HELIOS GREEN LIGHT SOLAR</div>
</div>

<div id="moduleSection" class="summary-grid">
    <div class="summary-card" onclick="selectModule('delivery')">
        <div class="summary-icon">📦</div>
        <div class="summary-title">Material Delivery</div>
        <div class="summary-count" id="deliveryCount">0</div>
        <div class="summary-sub">Today: <span id="deliveryToday">0</span></div>
    </div>
    <div class="summary-card" onclick="selectModule('installation')">
        <div class="summary-icon">🔧</div>
        <div class="summary-title">Material Installation</div>
        <div class="summary-count" id="installationCount">0</div>
        <div class="summary-sub">Today: <span id="installationToday">0</span></div>
    </div>
</div>

<div id="divisionHeading" class="section-title" style="display:none;">Divisions</div>
<div id="divisionSection" class="division-grid" style="display:none;">
    <div class="division-card" id="btn1" onclick="showDivision(event,'Tadepalligudem')">
        <div class="division-left">
            <div class="division-name">📍 Tadepalligudem</div>
            <div class="division-stats">
                <span>Today : <b id="tadeToday">0</b></span>
                <span>Total : <b id="tadeTotal">0</b></span>
            </div>
        </div>
        <div class="division-arrow">➜</div>
    </div>

    <div class="division-card" id="btn2" onclick="showDivision(event,'Narsipatnam')">
        <div class="division-left">
            <div class="division-name">📍 Narsipatnam</div>
            <div class="division-stats">
                <span>Today : <b id="narsiToday">0</b></span>
                <span>Total : <b id="narsiTotal">0</b></span>
            </div>
        </div>
        <div class="division-arrow">➜</div>
    </div>

    <div class="division-card" id="btn3" onclick="showDivision(event,'Chirala')">
        <div class="division-left">
            <div class="division-name">📍 Chirala</div>
            <div class="division-stats">
                <span>Today : <b id="chiralaToday">0</b></span>
                <span>Total : <b id="chiralaTotal">0</b></span>
            </div>
        </div>
        <div class="division-arrow">➜</div>
    </div>

    <div class="division-card" id="btn4" onclick="showDivision(event,'Bapatla')">
        <div class="division-left">
            <div class="division-name">📍 Bapatla</div>
            <div class="division-stats">
                <span>Today : <b id="bapatlaToday">0</b></span>
                <span>Total : <b id="bapatlaTotal">0</b></span>
            </div>
        </div>
        <div class="division-arrow">➜</div>
    </div>
</div>

<div id="totalCount" style="display:none;"></div>
  
<div id="divisionSearch" class="search-card" style="display:none;">
    <div class="search-title">🔍 Search in Division</div>
    <div class="search-row">
        <select id="searchType">
            <option value="service">Service Number</option>
            <option value="name">Customer Name</option>
            <option value="phone">Phone Number</option>
            <option value="subdivision">Sub Division</option>
            <option value="section">Section</option>
            <option value="distribution">Distribution</option>
            <option value="date">📅 Filter By Date</option>
        </select>

        <div id="searchBox">
            <input id="searchInput" type="text" placeholder="Enter Search Value">
            <button onclick="performSearch()">Search</button>
        </div>

        <div id="dateBox" style="display:none;">
            <input type="date" id="fromDate">
            <input type="date" id="toDate">
            <div style="display:flex;gap:10px;margin-top:10px;">
                <button id="applyBtn" onclick="applyDateFilter()">Filter</button>
                <button onclick="clearDateFilter()">Clear</button>
            </div>
        </div>
    </div>
</div>

<div id="data" style="display:none;"></div>
<div id="detailView" style="display:none;"></div>

<script>
let fullData = [];
let dashboard = {};
let selectedModule = ""; // 'delivery' or 'installation'
let selectedDivision = "";
let currentView = "home"; // 'home', 'module', 'division', 'search', 'details'
let isProcessing = false;

const BASE_URL = "https://script.google.com/macros/s/AKfycbwOybv133i3cqAU743ilXV0QWRoR6JfnGw93Nc8PQVwDrNnRFN4WSNJez9xpRR_ls3O/exec";

// STEP 1: Main Home -> Select Module
function selectModule(moduleType) {
    selectedModule = moduleType;
    currentView = "module";
    
    // Update header dynamically
    document.getElementById("mainHeader").innerText = moduleType === 'delivery' ? "📦 MATERIAL DELIVERY" : "🔧 MATERIAL INSTALLATION";
    
    // Update specific division metrics targets
    updateDivisionCardsUI();
    
    // Toggle Sections
    document.getElementById("moduleSection").style.display = "none";
    document.getElementById("divisionHeading").style.display = "block";
    document.getElementById("divisionSection").style.display = "flex";
}

function updateDivisionCardsUI() {
    if (!dashboard.divisions) return;
    
    const divData = dashboard.divisions;
    const m = selectedModule; // 'delivery' or 'installation'
    
    document.getElementById("tadeToday").innerText = divData.Tadepalligudem[m + "Today"];
    document.getElementById("tadeTotal").innerText = divData.Tadepalligudem[m + "Total"];
    
    document.getElementById("narsiToday").innerText = divData.Narsipatnam[m + "Today"];
    document.getElementById("narsiTotal").innerText = divData.Narsipatnam[m + "Total"];
    
    document.getElementById("chiralaToday").innerText = divData.Chirala[m + "Today"];
    document.getElementById("chiralaTotal").innerText = divData.Chirala[m + "Total"];
    
    document.getElementById("bapatlaToday").innerText = divData.Bapatla[m + "Today"];
    document.getElementById("bapatlaTotal").innerText = divData.Bapatla[m + "Total"];
}

// STEP 2: Module View -> Click Division
async function showDivision(e, divisionName) {
    selectedDivision = divisionName;
    currentView = "division";

    if (isProcessing) return;
    isProcessing = true;

    const cards = document.querySelectorAll(".division-card");
    cards.forEach(card => {
        card.style.pointerEvents = "none";
        card.classList.add("loading");
    });

    const clickedCard = e.currentTarget;
    const arrow = clickedCard.querySelector(".division-arrow");
    const oldArrow = arrow.innerHTML;
    arrow.innerHTML = "⏳";

    try {
        if (!fullData.length) {
            await loadData();
        }

        // Filter items dynamically by selected Division AND selected Module flag if applicable
        // (Assuming the master JSON objects have fields to map data natively)
        let divisionData = fullData.filter(item => {
            const div = (item.division || "").toString().trim().toLowerCase().replace(/\s+/g, "");
            
            // Basic sheet validation mapping logic matching backend logic if criteria differs
            return div === divisionName.toLowerCase().replace(/\s+/g, "");
        });

        // UI view setups
        document.getElementById("divisionHeading").style.display = "none";
        document.getElementById("divisionSection").style.display = "none";
        document.getElementById("totalCount").style.display = "block";
        document.getElementById("divisionSearch").style.display = "block";
        
        // Reset inputs
        document.getElementById("searchType").value = "service";
        document.getElementById("searchInput").value = "";
        document.getElementById("fromDate").value = "";
        document.getElementById("toDate").value = "";
        document.getElementById("searchBox").style.display = "block";
        document.getElementById("dateBox").style.display = "none";

        const divMeta = dashboard.divisions[divisionName];
        const displayModuleName = selectedModule === 'delivery' ? 'Material Delivery' : 'Installation';

        document.getElementById("totalCount").innerHTML = `
            <b>📍 ${divisionName} — ${displayModuleName}</b><br>
            Today: <b>${divMeta[selectedModule + 'Today']}</b> | Total: <b>${divMeta[selectedModule + 'Total']}</b>
        `;

        const today = getTodayIST();
        const todayData = divisionData.filter(item => {
            const d = toIST(item.timestamp);
            return d &&
                d.getFullYear() === today.getFullYear() &&
                d.getMonth() === today.getMonth() &&
                d.getDate() === today.getDate();
        });
        
        document.getElementById("data").style.display = "block";
        renderData(todayData);

    } catch (err) {
        alert("Error loading division content.");
        console.error(err);
    } finally {
        cards.forEach(card => {
            card.style.pointerEvents = "auto";
            card.classList.remove("loading");
        });
        arrow.innerHTML = oldArrow;
        isProcessing = false;
    }
}

// Global Core Data Loader
async function loadData() {
    try {
        const [res, countRes] = await Promise.all([
            fetch(BASE_URL + "?type=all&t=" + Date.now()),
            fetch(BASE_URL + "?action=dashboardCounts&t=" + Date.now())
        ]);

        fullData = await res.json();
        dashboard = await countRes.json();

        // Feed Global Total metrics
        document.getElementById("installationCount").innerText = dashboard.installation.total;
        document.getElementById("installationToday").innerText = dashboard.installation.today;
        document.getElementById("deliveryCount").innerText = dashboard.delivery.total;
        document.getElementById("deliveryToday").innerText = dashboard.delivery.today;

        fullData = fullData.filter(item => item.timestamp);
    } catch (err) {
        console.error(err);
        alert("Unable to load initial infrastructure data.");
    }
}

async function performSearch() {
    const value = document.getElementById("searchInput").value.trim();
    if (!value) return;

    currentView = "search";
    const container = document.getElementById("data");
    container.innerHTML = "<p style='text-align:center;'>⏳ Searching...</p>";

    try {
        const url = BASE_URL
            + "?action=search"
            + "&division=" + encodeURIComponent(selectedDivision)
            + "&field=" + encodeURIComponent(document.getElementById("searchType").value)
            + "&value=" + encodeURIComponent(value)
            + "&t=" + Date.now();

        const res = await fetch(url);
        const result = await res.json();

        document.getElementById("totalCount").innerText = `Search Results: ${result.length}`;

        const enrichedResult = result.map(r => {
            const rService = (r.service || "").toString().trim();
            const match = fullData.find(f => (f.service || "").toString().trim() === rService);
            return match ? match : r;
        });

        renderData(enrichedResult);
        document.getElementById("searchInput").value = "";
    } catch (err) {
        container.innerHTML = "<p style='text-align:center;'>Error fetching query records.</p>";
    }
}

function toIST(dateInput) {
    if (!dateInput) return null;
    const parts = dateInput.split(/[- :]/);
    return new Date(parts[0], parts[1] - 1, parts[2], parts[3], parts[4], parts[5]);
}

function getTodayIST() {
    const now = new Date();
    const formatter = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Kolkata", year: "numeric", month: "2-digit", day: "2-digit"
    });
    const parts = formatter.formatToParts(now);
    return new Date(
        parts.find(p => p.type === "year").value,
        parts.find(p => p.type === "month").value - 1,
        parts.find(p => p.type === "day").value
    );
}

function renderData(data) {
    const container = document.getElementById("data");
    container.innerHTML = "";

    if (!data.length) {
        container.innerHTML = "<p style='text-align:center; padding: 20px; color:#666;'>No submission data found.</p>";
        return;
    }

    data.sort((a, b) => toIST(b.timestamp) - toIST(a.timestamp));
    let currentDate = "";

    data.forEach(item => {
        const d = toIST(item.timestamp);
        if (!d) return;

        const dateStr = String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();

        if (dateStr !== currentDate) {
            currentDate = dateStr;
            container.innerHTML += `<div class="date-header">${dateStr}</div>`;
        }

        const time = d.toLocaleTimeString("en-IN", {
            hour: "2-digit", minute: "2-digit", hour12: true, timeZone: "Asia/Kolkata"
        });

        container.innerHTML += `  
            <div class="card" onclick='openDetails(${JSON.stringify(item)})'>
                <b>${item.service || "No Service #"}</b><br>
                ${item.name || "Unknown Customer"}<br>
                ${item.phone || "-"}<br>
                <b>Surveyor:</b> ${item.surveyor || "-"}<br>
                <div class="time">${time}</div>
            </div>`;
    });
}

function openDetails(item) {
    currentView = "details";
    const detail = document.getElementById("detailView");

    document.getElementById("data").style.display = "none";
    document.getElementById("divisionSearch").style.display = "none";
    document.getElementById("totalCount").style.display = "none";
    detail.style.display = "block";

    const val = (v) => (v !== undefined && v !== null && v.toString().trim() !== "") ? v.toString().trim() : "-";
    const link = (url) => url ? `<a href="${url}" target="_blank" style="display:inline-block;padding:8px 14px;background:#1565C0;color:#fff;border-radius:8px;text-decoration:none;margin-top:5px;">📷 View Image</a>` : "-";

    detail.innerHTML = `
        <h2>Service Details</h2>
        <p><b>Service No:</b> ${val(item.service)}</p>
        <p><b>Customer:</b> ${val(item.name)}</p>
        <p><b>Phone:</b> ${val(item.phone)}</p>
        <p><b>Division:</b> ${val(item.division)}</p>
        <p><b>Surveyor:</b> ${val(item.surveyor)}</p>
        <p><b>Panel Image:</b><br>${link(item.panels)}</p>
        <p><b>Inverter Image:</b><br>${link(item.inverter)}</p>
        <p><b>Earth Image:</b><br>${link(item.earth)}</p>
        <br>
        <button style="height:40px; width:100px; background:#666; color:white; border:none; border-radius:8px; cursor:pointer;" onclick="closeDetails()">← Back</button>
    `;
}

function closeDetails() {
    document.getElementById("detailView").style.display = "none";
    document.getElementById("divisionSearch").style.display = "block";
    document.getElementById("totalCount").style.display = "block";
    document.getElementById("data").style.display = "block";
    currentView = "division";
}

// 3-Level Dynamic Navigation Core
function goBack() {
    if (currentView === "details") {
        closeDetails();
        return;
    }
    if (currentView === "search" || currentView === "division") {
        // Go back to Level 2 (Module View)
        document.getElementById("divisionSearch").style.display = "none";
        document.getElementById("data").style.display = "none";
        document.getElementById("totalCount").style.display = "none";
        
        document.getElementById("divisionHeading").style.display = "block";
        document.getElementById("divisionSection").style.display = "flex";
        currentView = "module";
        return;
    }
    if (currentView === "module") {
        // Go back to Level 1 (Dashboard Home View)
        document.getElementById("mainHeader").innerText = "HELIOS GREEN LIGHT SOLAR";
        document.getElementById("divisionHeading").style.display = "none";
        document.getElementById("divisionSection").style.display = "none";
        
        document.getElementById("moduleSection").style.display = "grid";
        currentView = "home";
        return;
    }
    window.location.href = "index.html";
}

async function applyDateFilter() {
    const btn = document.getElementById("applyBtn");
    if (btn.disabled) return;

    btn.disabled = true;
    btn.innerText = "⏳ ...";

    const container = document.getElementById("data");
    container.innerHTML = "<p style='text-align:center;'>⏳ Applying filter...</p>";

    try {
        const from = document.getElementById("fromDate").value;
        const to = document.getElementById("toDate").value;

        if (!from || !to) {
            alert("Select both dates");
            return;
        }

        const fromDate = new Date(from);
        const toDate = new Date(to);
        toDate.setHours(23, 59, 59, 999);

        const filtered = fullData.filter(item => {
            const d = toIST(item.timestamp);
            return d && d >= fromDate && d <= toDate &&
                (item.division || "").toLowerCase().replace(/\s+/g, "") === selectedDivision.toLowerCase().replace(/\s+/g, "");
        });

        document.getElementById("totalCount").innerText = `${selectedDivision} | ${from} → ${to} | Count: ${filtered.length}`;
        renderData(filtered);
    } catch (err) {
        alert("Error applying timeline constraint.");
    } finally {
        setTimeout(() => {
            btn.disabled = false;
            btn.innerText = "Filter";
        }, 500);
    }
}

function clearDateFilter() {
    document.getElementById("fromDate").value = "";
    document.getElementById("toDate").value = "";
    let mockEvent = { currentTarget: document.getElementById(selectedDivision === "Tadepalligudem" ? "btn1" : selectedDivision === "Narsipatnam" ? "btn2" : selectedDivision === "Chirala" ? "btn3" : "btn4") };
    showDivision(mockEvent, selectedDivision);
}

window.onload = async function () {
    document.getElementById("searchInput").addEventListener("keypress", function (e) {
        if (e.key === "Enter") performSearch();
    });

    document.getElementById("searchType").addEventListener("change", function () {
        if (this.value === "date") {
            document.getElementById("searchBox").style.display = "none";
            document.getElementById("dateBox").style.display = "block";
        } else {
            document.getElementById("searchBox").style.display = "block";
            document.getElementById("dateBox").style.display = "none";
        }
    });

    await loadData();
};
</script>
</body>
</html>
